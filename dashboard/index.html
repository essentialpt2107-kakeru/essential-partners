<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#9c5f72">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="美yond 数字">
<title>美yond 経営ダッシュボード</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<!--
  美yond の経営ダッシュボード（Webアプリ版）。
  このページには数字もお客様の名前も入っていない。合言葉を送ると、データ係（Google Apps Script）が
  Google ドライブの「biyond_dashboard_bundle.json」（画面の中身＋データ）を返し、それをここで表示する。
  公開の保管庫に置くので、ここに数字・目標・合言葉を書かない。
-->
<style>
  :root {
    color-scheme: light;
    --color-fg: #3b2f33; --color-fg-muted: #8a7a7e; --color-bg: #faf6f1; --color-panel: #ffffff; --color-border-line: #eadfd8;
    --color-ok: #4f9a7a; --color-warn: #c0893a; --color-bad: #c4566b;
    --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 16px; --cds-gap-xl: 24px;
    --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 16px; --cds-radius: 10px;
    --cds-font-size-caption: 12px; --cds-font-size-body: 14px; --cds-font-size-heading: 16px; --cds-font-size-title: 26px;
    --cds-font-weight-medium: 600; --cds-dur-slow: .4s;
    --cds-chart-grid: #f1e8e2; --cds-chart-axis: #dccdc4; --cds-chart-muted: #d6c6c9; --cds-chart-reference: #a8939a;
    --cds-surface-popover: #ffffff; --cds-border: #eadfd8; --cds-text-secondary: #8a7a7e; --cds-shadow-popover: 0 6px 24px rgba(120, 70, 85, .14);
    --font-anthropic-sans: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    --font-anthropic-serif: "Noto Serif JP", "Hiragino Mincho ProN", serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: 14px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  body { padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  #app { max-width: 1200px; margin: 0 auto; }
  .dash-skeleton { color: transparent !important; background: linear-gradient(90deg, #f3ebe6 25%, #faf4f0 50%, #f3ebe6 75%); background-size: 200% 100%; animation: sk 1.4s infinite linear; border-radius: 6px; }
  @keyframes sk { to { background-position: -200% 0; } }
  .dash-select { font: inherit; font-size: 13px; color: var(--color-fg); background-color: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 6px; padding: 4px 8px; }

  /* 入口（合言葉） */
  .gate { min-height: 86vh; display: grid; place-items: center; }
  .gate-card { width: min(100%, 380px); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 18px; padding: 32px 24px 26px; box-shadow: 0 10px 40px rgba(120, 70, 85, .12); display: grid; gap: 16px; text-align: center; }
  .gate-logo { width: 64px; height: 64px; margin: 0 auto; border-radius: 16px; background: linear-gradient(135deg, #9c5f72, #d4a37f); color: #fff; font-family: var(--font-anthropic-serif); font-size: 32px; display: grid; place-items: center; }
  .gate h1 { margin: 0; font-family: var(--font-anthropic-serif); font-weight: 600; font-size: 20px; letter-spacing: .06em; }
  .gate p { margin: 0; color: var(--color-fg-muted); font-size: 13px; }
  .gate input[type=password] { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--color-border-line); border-radius: 10px; background: #fff; color: var(--color-fg); }
  .gate input:focus-visible, .gate button:focus-visible { outline: 2px solid #b8667c; outline-offset: 2px; }
  .gate label.keep { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 13px; color: var(--color-fg-muted); }
  .gate button { font: inherit; font-size: 15px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #a96479, #c98f7a); border: 0; border-radius: 10px; padding: 12px; cursor: pointer; }
  .gate button[disabled] { opacity: .6; cursor: default; }
  .gate .err { color: var(--color-bad); font-size: 13px; min-height: 1.2em; }
  .appbar { display: flex; justify-content: flex-end; gap: 8px; margin: 0 0 8px; }
  .appbar button { font: inherit; font-size: 12px; color: var(--color-fg-muted); background: none; border: 1px solid var(--color-border-line); border-radius: 999px; padding: 3px 12px; cursor: pointer; }

  /* AI店長 */
  .ai-fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 50; font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #a96479, #c98f7a); border: 0; border-radius: 999px; padding: 12px 18px; box-shadow: 0 8px 24px rgba(120, 70, 85, .28); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .ai-fab .ai-face { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.25); display: grid; place-items: center; font-family: var(--font-anthropic-serif); }
  .ai-panel { position: fixed; z-index: 60; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: min(420px, calc(100vw - 32px)); height: min(640px, calc(100vh - 32px)); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 18px; box-shadow: 0 16px 48px rgba(120, 70, 85, .22); display: flex; flex-direction: column; overflow: hidden; }
  @media (max-width: 560px) { .ai-panel { left: 0; right: 0; bottom: 0; width: 100%; height: 88vh; border-radius: 18px 18px 0 0; } }
  .ai-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: linear-gradient(135deg, #9c5f72, #c98f7a); color: #fff; }
  .ai-head b { font-family: var(--font-anthropic-serif); font-weight: 600; font-size: 16px; letter-spacing: .04em; }
  .ai-head small { display: block; font-size: 11px; opacity: .85; line-height: 1.4; }
  .ai-head .ai-sp { flex: 1; }
  .ai-head button { white-space: nowrap; font: inherit; font-size: 12px; color: #fff; background: rgba(255,255,255,.18); border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .ai-log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #fcf9f6; }
  .ai-msg { max-width: 92%; padding: 10px 12px; border-radius: 14px; font-size: 14px; line-height: 1.7; word-break: break-word; }
  .ai-msg.me { align-self: flex-end; background: #f3e3e6; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .ai-msg.bot { align-self: flex-start; background: #fff; border: 1px solid var(--color-border-line); border-bottom-left-radius: 4px; }
  .ai-msg.bot p { margin: 0 0 6px; } .ai-msg.bot p:last-child { margin: 0; }
  .ai-msg.bot h4 { margin: 8px 0 4px; font-size: 14px; color: #9c5f72; }
  .ai-msg.bot ul, .ai-msg.bot ol { margin: 2px 0 6px; padding-left: 20px; }
  .ai-tbl { overflow-x: auto; margin: 4px 0 8px; }
  .ai-tbl table { border-collapse: collapse; font-size: 13px; }
  .ai-tbl th, .ai-tbl td { border: 1px solid var(--color-border-line); padding: 4px 8px; text-align: left; white-space: nowrap; }
  .ai-tbl th { background: #f7eef0; font-weight: 600; }
  .ai-msg.err { align-self: center; background: none; color: var(--color-bad); font-size: 13px; }
  .ai-msg.wait { color: var(--color-fg-muted); }
  .ai-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ai-chips button { font: inherit; font-size: 12px; color: #9c5f72; background: #fff; border: 1px solid #e6cdd3; border-radius: 999px; padding: 5px 10px; cursor: pointer; text-align: left; }
  .ai-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--color-border-line); background: var(--color-panel); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .ai-form textarea { flex: 1; resize: none; font: inherit; font-size: 16px; line-height: 1.5; padding: 8px 10px; border: 1px solid var(--color-border-line); border-radius: 10px; min-height: 42px; max-height: 140px; color: var(--color-fg); background: #fff; }
  .ai-form button { font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #a96479, #c98f7a); border: 0; border-radius: 10px; padding: 0 14px; cursor: pointer; }
  .ai-form button[disabled] { opacity: .5; cursor: default; }
  .ai-note { font-size: 11px; color: var(--color-fg-muted); padding: 0 12px 6px; background: var(--color-panel); }
</style>
</head>
<body>
<div id="app">
  <div class="gate" id="gate">
    <form class="gate-card" id="gate-form" autocomplete="on">
      <div class="gate-logo" aria-hidden="true">美</div>
      <h1>美yond 経営ダッシュボード</h1>
      <p>合言葉を入れてください</p>
      <input type="text" name="username" value="biyond-dashboard" autocomplete="username" hidden>
      <input type="password" id="pass" name="password" autocomplete="current-password" aria-label="合言葉" required>
      <label class="keep"><input type="checkbox" id="keep" checked> この端末で30日間おぼえる</label>
      <button type="submit" id="go">開く</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </div>
  <div id="main" hidden>
    <div class="appbar"><button type="button" id="reload">最新にする</button><button type="button" id="logout">この端末から出る</button></div>
    <div id="dash-root"></div>
  </div>
  <button type="button" class="ai-fab" id="ai-fab" hidden><span class="ai-face" aria-hidden="true">美</span>AI店長に相談</button>
  <section class="ai-panel" id="ai-panel" hidden aria-label="AI店長">
    <div class="ai-head"><div><b>AI店長</b><small>お店の数字とこれまでの考え方をふまえて答えます</small></div><span class="ai-sp"></span><button type="button" id="ai-new">新しい相談</button><button type="button" id="ai-close" aria-label="閉じる">閉じる</button></div>
    <div class="ai-log" id="ai-log" aria-live="polite"></div>
    <form class="ai-form" id="ai-form"><textarea id="ai-text" rows="1" placeholder="例：来月の売上を上げるには？" aria-label="相談したいこと"></textarea><button type="submit" id="ai-send">送る</button></form>
    <div class="ai-note">AIの答えはまちがうこともあります。大事な判断は数字を確かめてから。</div>
  </section>
</div>
<script>
(function () {
  "use strict";
  // データ係（Google Apps Script のウェブアプリ）の住所。gas/Code.gs をデプロイして入れる
  var API = 'https://script.google.com/macros/s/AKfycbyQQD8v_E3dWRNcMfhzeJAiWyrHgn5-yMUkaj6VEfBGhrs6p7rc1asgWk3a8ass5wYrQg/exec';
  var TOKEN_KEY = 'biyond-dash-token';
  var CHAT_KEY = 'biyond-ai-chat';
  var memToken = null;

  // ---- ダッシュボードの型の代わり（dash.data / onData / calc / setLink） ----
  var D = null, calcs = {}, fns = [];
  window.dash = {
    colors: ['#c76b7e', '#6fa08a', '#c9a050', '#8f7fc0', '#5f94bf', '#e08a68'],
    data: function (id) {
      if (!D) return { status: 'loading', data: [] };
      if (calcs[id]) {
        var c = calcs[id];
        try { return { status: 'ok', data: c.fn.apply(null, c.inputs.map(function (i) { return D[i] || []; })) }; }
        catch (e) { console.error(id, e); return { status: 'error', data: [] }; }
      }
      return D[id] ? { status: 'ok', data: D[id] } : { status: 'missing', data: [] };
    },
    onData: function (f) { fns.push(f); run(f); },
    calc: function (id, o) { calcs[id] = o; },
    setLink: function () {}, loader: function () {}, draw: function () {}, params: function () { return {}; }, setParams: function () {}
  };
  function run(f) { try { f(); } catch (e) { console.error('onData', e); } }
  function redraw() { fns.forEach(run); }
  var rt;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(redraw, 200); });

  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function ask(body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }

  function mount(bundle) {
    D = bundle.data || {};
    var root = document.getElementById('dash-root');
    var tpl = document.createElement('template');
    tpl.innerHTML = bundle.page || '';
    var scripts = Array.prototype.slice.call(tpl.content.querySelectorAll('script'));
    scripts.forEach(function (s) { s.parentNode.removeChild(s); });
    root.replaceChildren(tpl.content);
    document.getElementById('gate').hidden = true;
    document.getElementById('main').hidden = false;
    scripts.forEach(function (s) { var n = document.createElement('script'); n.textContent = s.textContent; document.body.appendChild(n); });
    requestAnimationFrame(function () { setTimeout(redraw, 60); });
  }

  var MSG = { wrong: '合言葉がちがいます', locked: 'まちがいが続いたので、15分ほど待ってからもう一度どうぞ', not_setup: 'データ係の合言葉がまだ設定されていません', no_data: 'データのファイルが見つかりません' };
  function fail(code) {
    document.getElementById('err').textContent = MSG[code] || '開けませんでした（' + (code || '通信') + '）';
    document.getElementById('go').disabled = false;
    document.getElementById('gate').hidden = false;
    document.getElementById('main').hidden = true;
  }

  function open(body) {
    if (!API) { fail('データ係の住所が未設定'); return; }
    document.getElementById('go').disabled = true;
    document.getElementById('err').textContent = '読み込んでいます…';
    ask(body).then(function (r) {
      if (r && r.ok && r.answer == null) r = { ok: false, error: 'ai_not_setup' };
      if (!r || !r.ok) { if (body.token) store(TOKEN_KEY, null); fail(r && r.error); return; }
      if (r.token) memToken = r.token; else if (body.token) memToken = body.token;
      if (r.token && document.getElementById('keep').checked) store(TOKEN_KEY, r.token);
      document.getElementById('err').textContent = '';
      mount(r.bundle);
      document.getElementById('ai-fab').hidden = false;
    }).catch(function () { fail(); });
  }

  document.getElementById('gate-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var p = document.getElementById('pass').value;
    if (p) open({ pass: p, keep: document.getElementById('keep').checked });
  });
  document.getElementById('logout').addEventListener('click', function () { store(TOKEN_KEY, null); store(CHAT_KEY, null); location.reload(); });
  document.getElementById('reload').addEventListener('click', function () { location.reload(); });


  // ---- AI店長（相談チャット） ----
  var chat = [];
  try { chat = JSON.parse(load(CHAT_KEY) || '[]') || []; } catch (e) { chat = []; }
  var EXAMPLES = ['来月の売上を上げるために、今週やるべきことを3つ教えて', '新規のお客様を回数券・サブスクにつなげるには？', '空いている時間帯を埋めるアイデアは？', '今期の目標に届くには、月にいくら足りない？', '失客しそうなお客様を呼び戻す方法は？'];
  var AIMSG = { ai_not_setup: 'AI店長の鍵（APIキー）がまだ登録されていません', ai_limit: '今日の相談の回数の上限に達しました。少し時間をおいてからどうぞ', ai_busy: 'いま混み合っています。少し待ってからもう一度送ってください', ai_key: 'AI店長の鍵（APIキー）が使えませんでした', wrong: 'ログインの期限が切れました。画面を読み込み直してください', locked: 'まちがいが続いたので、15分ほど待ってください' };
  var logEl = document.getElementById('ai-log'), txt = document.getElementById('ai-text'), sendBtn = document.getElementById('ai-send');
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  // 太字（**…**）だけを安全に描く
  function inline(parent, s) {
    var parts = String(s).split(/\*\*(.+?)\*\*/g);
    parts.forEach(function (p, i) { if (!p) return; if (i % 2) parent.appendChild(el('b', null, p)); else parent.appendChild(document.createTextNode(p)); });
  }
  function renderMd(box, text) {
    var list = null, tbl = null;
    String(text).split('\n').forEach(function (line) {
      var t = line.replace(/\s+$/, '');
      var m;
      if (/^\s*\|.*\|\s*$/.test(t)) {
        list = null;
        var cells = t.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); });
        if (cells.every(function (c) { return /^:?-{2,}:?$/.test(c); })) return;
        if (!tbl) { var wrap = el('div', 'ai-tbl'); tbl = el('table'); wrap.appendChild(tbl); box.appendChild(wrap); tbl._head = true; }
        var tr = el('tr');
        cells.forEach(function (c) { var td = el(tbl._head ? 'th' : 'td'); inline(td, c); tr.appendChild(td); });
        tbl.appendChild(tr); tbl._head = false;
        return;
      }
      tbl = null;
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(t)) { list = null; return; }
      if (!t.trim()) { list = null; return; }
      if ((m = t.match(/^#{1,6}\s+(.*)/))) { list = null; var h = el('h4'); inline(h, m[1]); box.appendChild(h); return; }
      if ((m = t.match(/^\s*[-*・]\s+(.*)/)) || (m = t.match(/^\s*\d+[.)．]\s+(.*)/))) {
        var ordered = /^\s*\d/.test(t);
        if (!list || list.tagName !== (ordered ? 'OL' : 'UL')) { list = el(ordered ? 'ol' : 'ul'); box.appendChild(list); }
        var li = el('li'); inline(li, m[1]); list.appendChild(li); return;
      }
      list = null; var p = el('p'); inline(p, t); box.appendChild(p);
    });
  }
  function draw() {
    logEl.replaceChildren();
    if (!chat.length) {
      var hi = el('div', 'ai-msg bot');
      renderMd(hi, 'こんにちは、AI店長です。売上を上げる施策、集客、リピート、メニューや価格のことなど、なんでも相談してください。お店の数字（RING・予約・サブスク）とこれまでの考え方をふまえて答えます。');
      logEl.appendChild(hi);
      var chips = el('div', 'ai-chips');
      EXAMPLES.forEach(function (q) { var b = el('button', null, q); b.type = 'button'; b.addEventListener('click', function () { send(q); }); chips.appendChild(b); });
      logEl.appendChild(chips);
    }
    chat.forEach(function (m) {
      var d = el('div', 'ai-msg ' + (m.role === 'user' ? 'me' : 'bot'));
      if (m.role === 'user') d.textContent = m.content; else renderMd(d, m.content);
      logEl.appendChild(d);
    });
    logEl.scrollTop = logEl.scrollHeight;
  }
  function save() { try { store(CHAT_KEY, JSON.stringify(chat.slice(-40))); } catch (e) {} }
  function send(q) {
    q = String(q || '').trim();
    if (!q || sendBtn.disabled) return;
    var tk = memToken || load(TOKEN_KEY);
    chat.push({ role: 'user', content: q }); save(); draw();
    txt.value = ''; fit();
    var wait = el('div', 'ai-msg bot wait', '考えています…（30秒ほどかかることがあります）');
    logEl.appendChild(wait); logEl.scrollTop = logEl.scrollHeight;
    sendBtn.disabled = true;
    ask({ token: tk, ask: chat.slice(-20) }).then(function (r) {
      wait.remove();
      if (!r || !r.ok) { chat.pop(); save(); draw(); txt.value = q; fit(); logEl.appendChild(el('div', 'ai-msg err', AIMSG[r && r.error] || '答えをもらえませんでした（' + ((r && r.error) || '通信') + '）')); return; }
      chat.push({ role: 'assistant', content: r.answer || '（答えが空でした）' }); save(); draw();
    }).catch(function () { wait.remove(); chat.pop(); save(); draw(); txt.value = q; fit(); logEl.appendChild(el('div', 'ai-msg err', '通信できませんでした。もう一度送ってください')); })
      .then(function () { sendBtn.disabled = false; });
  }
  function fit() { txt.style.height = 'auto'; txt.style.height = Math.min(txt.scrollHeight, 140) + 'px'; }
  txt.addEventListener('input', fit);
  txt.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(txt.value); } });
  document.getElementById('ai-form').addEventListener('submit', function (e) { e.preventDefault(); send(txt.value); });
  document.getElementById('ai-fab').addEventListener('click', function () { document.getElementById('ai-panel').hidden = false; document.getElementById('ai-fab').hidden = true; draw(); txt.focus(); });
  document.getElementById('ai-close').addEventListener('click', function () { document.getElementById('ai-panel').hidden = true; document.getElementById('ai-fab').hidden = false; });
  document.getElementById('ai-new').addEventListener('click', function () { if (sendBtn.disabled) return; chat = []; save(); draw(); });

  var t = load(TOKEN_KEY);
  if (t) open({ token: t });
})();
</script>
</body>
</html>
